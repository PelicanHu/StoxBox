        if (id(g_count) < 6 || id(g_price_5) <= 0) return NAN;
        return id(g_price_5);

  - platform: template
    name: "Ticker 6 value"
    id: ha_value_5
    unit_of_measurement: USD
    accuracy_decimals: 2
    device_class: monetary
    state_class: measurement
    update_interval: ${poll_seconds}
    lambda: |-
        if (id(g_count) < 6 || id(g_price_5) <= 0) return NAN;
        return id(g_price_5) * id(g_sh_5);        


