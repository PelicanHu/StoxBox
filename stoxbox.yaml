# StoxBox - ESPHome
# Hardware: Guition ESP32-S3-4848S040 (480x480)
# Author: pel@pel.hu
# The ticker symbols and share counts come from the configuration fields (g_tickers_raw, g_shares_raw).
# Up to 6 tickers. Multiple share counts: "10 4" or "10, 4", corresponding to the order of the tickers.
#
# secrets.yaml:
#   wifi_ssid / wifi_password / api_encryption_key

substitutions:
  device_name: stoxbox
  poll_seconds: "60s"
  app_version: "0.2"
  ha_topic: "stoxbox/quote"
  
esphome:
  name: ${device_name}
  includes:
    - <esp_heap_caps.h>
    - <esp_system.h>
    - <esp_chip_info.h>
    - <esp_flash.h>
    - <esp_partition.h>
    - <esp_ota_ops.h>
    - <esp_idf_version.h>
    - <esp_app_format.h>
    - <esp_psram.h>
    - <esp_wifi.h>
  friendly_name: 'StoxBox'
  min_version: "2025.2.0"
  on_boot:
    priority: -100
    then:
      - delay: 1s
      - lvgl.textarea.update:
          id: ta_tickers
          text: !lambda 'return id(g_tickers_raw);'
      - lvgl.textarea.update:
          id: ta_shares
          text: !lambda 'return id(g_shares_raw);'
      - lvgl.textarea.update:
          id: ta_currency
          text: !lambda 'return id(g_currency_code);'
      - lvgl.switch.update: 
          id: sw_relay1
          state:
            checked: !lambda 'return id(g_relay1);'
      - lambda: |-
          id(ha_ticker_list).publish_state(id(g_tickers_raw));
          id(ha_shares_list).publish_state(id(g_shares_raw));
          id(ha_currency).publish_state(id(g_currency_code));
          id(ha_relay1).publish_state(id(g_relay1));
          // Version / build time
          lv_obj_clear_flag(id(app_version), LV_OBJ_FLAG_HIDDEN);
          lv_label_set_text(id(app_version), "StoxBox v${app_version}");
          lv_label_set_text(id(info_version), "${app_version}");
          lv_label_set_text(id(info_build), __DATE__ " " __TIME__);
      - light.turn_on:
          id: display_backlight
          brightness: 0.5
          transition_length: 0s
      - lvgl.page.show:
          id: page_splash
          animation: fade_in
          time: 500ms          
      - wait_until:
          condition:
            wifi.connected:
          timeout: 30s
      - lambda: |-
          char b[160];
          
          // CPU / chip revision
          esp_chip_info_t chip_info;
          esp_chip_info(&chip_info);
          snprintf(b, sizeof(b), "ESP32-S3 rev %d.%d",
                   chip_info.revision / 100, chip_info.revision % 100);
          lv_label_set_text(id(info_cpu), b);

          // Flash size
          uint32_t flash_size = 0;
          if (esp_flash_get_size(nullptr, &flash_size) == ESP_OK) {
            snprintf(b, sizeof(b), "%lu MB", (unsigned long)(flash_size / (1024UL * 1024UL)));
          } else {
            snprintf(b, sizeof(b), "--");
          }
          lv_label_set_text(id(info_flash), b);
          
          // SSID
          std::string ssid = id(wifi_ssid_info).state;
          lv_label_set_text(id(info_ssid), ssid.empty() ? "" : ssid.c_str());
      - delay: 2s
      - script.execute: fetch_currency
      - script.wait: fetch_currency  
      - script.execute: get_tickers_shares
#      - script.execute: paint_active
      - lvgl.page.show:
          id: page_quote
          animation: fade_in
          time: 500ms   
esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret stoxbox__encryption_key
ota:
  - platform: esphome
    on_begin:
      - light.turn_off:
          id: display_backlight
          transition_length: 0s
      - lambda: "id(display_backlight).loop();"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.0.15
  ap:
    ssid: StoxBox-Setup
    password: stockbox1234

captive_portal:

time:
  - platform: sntp
    id: sntp_time
    timezone: America/New_York
    on_time_sync:
      then:
        - script.execute: paint_session
        - script.execute: fetch_all

# mqtt: optional

http_request:
  useragent: StoxBox/1.0
  timeout: 15s
  verify_ssl: false

spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

i2c:
  id: touchscreen_bus
  sda: GPIO19
  scl:
    number: 45
    ignore_strapping_warning: true

output:
  - platform: ledc
    pin: GPIO38
    id: backlight_output
    frequency: 150Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    output: backlight_output
    name: Backlight
    id: display_backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 1s
    on_state:
      then:
        - lvgl.slider.update:
            id: backlight_slider
            value: !lambda |-
              if (id(display_backlight).remote_values.is_on()) {
                return id(display_backlight).remote_values.get_brightness() * 100.0f;
              } else {
                return 0.0f;
              }

display:
  - platform: st7701s
    id: tft_display
    spi_id: lcd_spi
    dimensions:
      width: 480
      height: 480
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: false
    cs_pin: 39
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    pclk_frequency: 12MHz
    pclk_inverted: false
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    update_interval: never
    auto_clear_enabled: false
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCD, 0x00]
    data_pins:
      red: [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue: [4, 5, 6, 7, 15]

touchscreen:
  - platform: gt911
    id: tft_touch
    display: tft_display
    i2c_id: touchscreen_bus

image:
  - file: "logo.png"
    id: img_applogo
    type: RGB565
    resize: 480x480
  - file: "back.png"
    id: img_infoback
    type: RGB565
    resize: 480x480

font:
  - file: "gfonts://Google Sans"
    id: font_price
    size: 100
    glyphs: "0123456789., -"
  - file: "gfonts://Google Sans"
    id: font_chg
    size: 32
    glyphs: "0123456789.,-+% "
  - file: "gfonts://Google Sans"
    id: font_value
    size: 52
    glyphs: "0123456789.,-ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz$€£¥ "
  - file: "gfonts://Google Sans"
    id: font_qty
    size: 26
    glyphs: "0123456789., share"
  - file: "gfonts://Google Sans"
    id: font_ui
    size: 22
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°"
  - file: "gfonts://Google Sans"
