                      id(g_shares_raw) = "";
                      if (tsh != nullptr) id(g_shares_raw) = std::string(tsh);
                      const char *tcur = lv_textarea_get_text(id(ta_currency));
                      id(g_currency_code) = tcur ? std::string(tcur) : std::string("USD");
                      for (size_t ci = 0; ci < id(g_currency_code).size(); ci++) {
                        char c = id(g_currency_code)[ci];
                        if (c >= 'a' && c <= 'z') id(g_currency_code)[ci] = (char)(c - 'a' + 'A');
                      }
                      if (id(g_currency_code).empty()) id(g_currency_code) = "USD";
                - script.execute: get_tickers_shares
                - script.execute: fetch_currency
#                - script.execute: fetch_all
                - lvgl.page.show:
                    id: page_quote
                    animation: OUT_BOTTOM
                    time: 250ms


text:
  - platform: template
    name: "Currency"
    id: ha_currency
    icon: "mdi:currency-usd"
    optimistic: true
    restore_value: true
    initial_value: "USD"
    min_length: 3
    max_length: 3
    mode: text
    set_action:
      - lambda: |-
          id(g_currency_code) = x;
          for (size_t ci = 0; ci < id(g_currency_code).size(); ci++) {
            char c = id(g_currency_code)[ci];
            if (c >= 'a' && c <= 'z') id(g_currency_code)[ci] = (char)(c - 'a' + 'A');
          }
          if (id(g_currency_code).empty()) id(g_currency_code) = "USD";
      - lvgl.textarea.update:
          id: ta_currency
          text: !lambda 'return id(g_currency_code);'
      - script.execute: fetch_currency

  - platform: template
    name: "Ticker list"
    id: ha_ticker_list
    icon: "mdi:format-list-bulleted"
    optimistic: true
    restore_value: true
    initial_value: "TSLA SPCX"
    min_length: 0
    max_length: 48
    mode: text
    set_action:
      - lambda: |-
          id(g_tickers_raw) = x;
      - lvgl.textarea.update:
          id: ta_tickers
          text: !lambda 'return x;'
      - script.execute: get_tickers_shares
      - script.execute: fetch_all

  - platform: template
    name: "Share list"
    id: ha_shares_list
    icon: "mdi:counter"
    optimistic: true
    restore_value: true
    initial_value: "626 0"
    min_length: 0
    max_length: 32
