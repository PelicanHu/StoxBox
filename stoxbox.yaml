switch:
  - platform: gpio
    pin: 40
    id: ha_relay1
    name: 'Relay 1'        
    on_turn_on:
      - if:
          condition:
            lambda: 'return !id(g_relay1);'
          then:
            - lambda: 'id(g_relay1) = true;'
            - lvgl.widget.update:
                id: sw_relay1
                state:
                  checked: true
            - lambda: 'id(g_relay1) = false;'
    on_turn_off:
      - if:
          condition:
            lambda: 'return !id(g_relay1);'
          then:
            - lambda: 'id(g_relay1) = true;'
            - lvgl.widget.update:
                id: sw_relay1
                state:
                  checked: false
            - lambda: 'id(g_relay1) = false;'
